spring:
  application:
    name: shop-app

  datasource:
    url: jdbc:h2:mem:shop-app
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: shop-app-secret-key-must-be-at-least-32-bytes!!
  expiration: 86400000
